<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evolution Arena</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu">
  <div class="card">
    <div class="logo">EVOLUTION <span>ARENA</span></div>
    <p class="sub">De ver de terre à éléphant. Mange, combats, évolue.</p>
    <input id="name" maxlength="16" placeholder="Choisis ton pseudo" autocomplete="off">
    <button id="play">JOUER</button>
    <div class="hint">WASD / ZQSD · Souris pour regarder · Clic ou ESPACE pour attaquer</div>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="topbar">
    <div class="pill"><b id="animal">Ver de terre</b> · Niv. <b id="level">1</b></div>
    <div class="score"><b>CLASSEMENT</b><div id="scores"></div></div>
  </div>

  <div id="center">
    <div id="zone">ZONE 1 — PETITS ANIMAUX</div>
    <div id="message"></div>
  </div>

  <div id="bottom">
    <div class="levelbox"><span>NIVEAU</span><strong id="lvlBig">1</strong></div>
    <div class="bars">
      <div class="bar xp"><i id="xpbar"></i></div>
      <div class="bar hp"><i id="hpbar"></i></div>
      <div class="numbers"><span>XP: <b id="xpText">0 / 35</b></span><span>PV: <b id="hpText">35 / 35</b></span></div>
    </div>
    <div class="power">⚔ <b id="power">4</b></div>
  </div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
