<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evolution Arena</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="lobbyCanvas"></div>
<div id="menu">
  <div class="vines vines-left"></div><div class="vines vines-right"></div>
  <div class="lobby-wrap">
    <div class="brand"><div class="logo">EVOLUTION <span>ARENA</span></div><div class="leaf-line">〰︎ 🌿 〰︎</div><p>De ver de terre à éléphant.</p></div>
    <div class="lobby-card">
      <div class="tabs"><button class="tab active" data-tab="playTab">JOUER</button><button class="tab" data-tab="shopTab">BOUTIQUE</button></div>
      <section id="playTab" class="tab-panel active"><input id="name" maxlength="16" placeholder="Ton pseudo" autocomplete="off"><button id="play">ENTRER DANS LA JUNGLE</button><small>ZQSD : avancer / reculer / tourner · Clic gauche : attaquer · R : réapparaître</small></section>
      <section id="shopTab" class="tab-panel"><div class="shop-head"><b>🪙 <span id="coins">0</span> pièces</b><span>Gagne 10 pièces à chaque élimination.</span></div><div id="shopGrid" class="shop-grid"></div></section>
    </div>
  </div>
</div>
<div id="hud" class="hidden">
  <div class="top"><div class="pill"><b id="animal">Ver de terre</b> · Niv. <b id="level">1</b></div><div class="coin-pill">🪙 <b id="gameCoins">0</b></div><div class="score"><b>CLASSEMENT</b><div id="scores"></div></div></div>
  <div id="dead" class="hidden"><div class="deadtitle">TU ES MORT</div><div class="death-sub">Ton évolution repart à zéro.</div><div class="death-actions"><button id="respawn">RÉAPPARAÎTRE</button><button id="lobbyBtn">LOBBY</button></div></div>
  <div id="center"><div id="zone">ZONE 1</div><div id="hitmsg"></div></div>
  <div id="bottom"><div class="lvl"><span>NIVEAU</span><strong id="lvlBig">1</strong></div><div class="stats"><div class="bar"><i id="xpbar"></i></div><div class="bar hp"><i id="hpbar"></i></div><div class="nums"><span>XP <b id="xpText">0 / 35</b></span><span>PV <b id="hpText">35 / 35</b></span><span>⚔ <b id="power">4</b></span></div></div></div>
</div>
<script type="module" src="game.js"></script>
</body></html>
